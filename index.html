<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Pedidos</title>

    <style>

        body{
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .contenedor{
            width: 400px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
        }

        h1{
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        label{
            font-weight: bold;
            color: #444;
        }

        input{
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button{
            width: 100%;
            padding: 12px;
            border: none;
            background: #ff9800;
            color: white;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover{
            background: #e68900;
        }

    </style>

</head>
<body>

    <div class="contenedor">

        <h1>Sistema de Pedidos de Comida</h1>

        <form action="PedidoServlet" method="post">

            <label>Nombre del cliente:</label>
            <input type="text" name="cliente" required>

            <label>Restaurante:</label>
            <input type="text" name="restaurante" required>

            <label>Comida:</label>
            <input type="text" name="comida" required>

            <label>Cantidad:</label>
            <input type="number" name="cantidad" required>

            <button type="submit">
                Realizar Pedido
            </button>
            <br><br>

            <a href="buscar.html">
            Buscar restaurante
            </a>
            <br><br>

            <a href="buscar.jsp">
            Buscar restaurante
            </a>
        </form>

    </div>

</body>
</html>
